name: Phraseator Core Tests

on:
  push:
    branches:
      - v0.1.0
  pull_request:
    branches:
      - main

jobs:
  core-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DPHRASEATOR_BUILD_VST3=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
