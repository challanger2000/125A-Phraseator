name: Phraseator Tests

on:
  push:
    branches:
      - v0.1.0
  pull_request:
    branches:
      - main

jobs:
  core-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure core
        run: cmake -S . -B build-core -DPHRASEATOR_BUILD_VST3=OFF

      - name: Build core
        run: cmake --build build-core --config Release

      - name: Test core
        run: ctest --test-dir build-core -C Release --output-on-failure

  vst3-build:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[vst3]')
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure VST3
        run: cmake -S . -B build-vst3 -DPHRASEATOR_BUILD_VST3=ON

      - name: Build VST3
        run: cmake --build build-vst3 --config Release --target Phraseator

      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: 125A-Phraseator-v0.1.0-Windows-x64
          path: build-vst3/VST3/Release/125A-Phraseator.vst3
          if-no-files-found: error
